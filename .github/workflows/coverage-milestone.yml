name: Coverage security milestone
on:
  push:
    branches: [finance-suite/coverage-security-85-90-20261106]
    paths: [.github/workflows/coverage-milestone.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MILESTONE_PHASE: focused-v2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: xdebug
      - name: Validate manifest
        id: manifest
        run: composer validate --strict
      - name: Audit locked dependencies
        run: composer audit --locked
      - name: Install exact source
        id: install
        if: always() && steps.manifest.outcome == 'success'
        run: |
          cp .env.testing .env
          composer install --no-interaction --prefer-dist --optimize-autoloader
          git restore --source=HEAD --worktree -- modules themes
          php artisan key:generate
      - name: Pint
        if: always() && steps.install.outcome == 'success'
        run: vendor/bin/pint --test
      - name: PHPStan
        if: always() && steps.install.outcome == 'success'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Focused behavioral coverage (not release acceptance)
        id: tests
        if: always() && steps.install.outcome == 'success'
        run: >-
          php artisan test --compact --coverage-clover=coverage.xml
          tests/Feature/ProviderSyncCoverageTest.php tests/Feature/Api/SageSyncTest.php
          tests/Feature/Api/XeroEntitiesSyncTest.php tests/Feature/Api/QuickBooksSyncTest.php
          tests/Feature/ProviderIntegrityRecoveryTest.php
          tests/Feature/Api/RevolutCoverageIntegrityTest.php tests/Feature/Api/RevolutPaymentTest.php
          tests/Feature/OutboundPaymentApprovalTest.php tests/Unit/Services/RevolutServiceTest.php
          tests/Feature/ModuleSafetyCoverageTest.php tests/Feature/HmrcBoundaryCoverageTest.php
          tests/Feature/HostModuleIntegrityTest.php tests/Feature/ModuleSystemTest.php
          tests/Unit/Modules/ModuleManagerTest.php tests/Feature/HmrcRtiPayeTest.php
          tests/Feature/HmrcCorporationTaxTest.php tests/Unit/Services/HmrcMtdVatServiceTest.php
          tests/Feature/PlaidSyncIntegrityCoverageTest.php tests/Unit/Services/PlaidServiceTest.php
          tests/Feature/Api/PlaidWebhookControllerTest.php tests/Feature/Api/PlaidControllerTest.php
          tests/Feature/Api/PlaidBalanceTest.php
          tests/Feature/PlaidProviderErrorCoverageTest.php tests/Feature/Api/PlaidWebhookCoverageTest.php
          tests/Feature/AdminUserManagementCoverageTest.php tests/Feature/PlaidEntryPointIntegrityTest.php
      - name: Preserve measured evidence
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milestone-${{ env.MILESTONE_PHASE }}-${{ github.sha }}
          path: coverage.xml
          retention-days: 30

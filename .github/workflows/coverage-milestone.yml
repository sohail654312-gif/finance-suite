name: Coverage security milestone
on:
  push:
    branches: [finance-suite/coverage-security-85-90-20261106]
    paths: [.github/workflows/coverage-milestone.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MILESTONE_PHASE: baseline
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: xdebug
      - name: Validate manifest
        id: manifest
        run: composer validate --strict
      - name: Audit locked dependencies
        run: composer audit --locked
      - name: Install exact source
        id: install
        if: always() && steps.manifest.outcome == 'success'
        run: |
          cp .env.testing .env
          composer install --no-interaction --prefer-dist --optimize-autoloader
          git restore --source=HEAD --worktree -- modules themes
          php artisan key:generate
      - name: Pint
        if: always() && steps.install.outcome == 'success'
        run: vendor/bin/pint --test
      - name: PHPStan
        if: always() && steps.install.outcome == 'success'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Full tests and unchanged release coverage gate
        id: tests
        if: always() && steps.install.outcome == 'success'
        run: php artisan test --coverage --min=100 --coverage-clover=coverage.xml
      - name: Independent host coverage verification
        if: always() && steps.tests.outcome != 'skipped'
        run: php scripts/verify-host-coverage.php coverage.xml
      - name: Preserve measured evidence
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milestone-${{ env.MILESTONE_PHASE }}-${{ github.sha }}
          path: coverage.xml
          retention-days: 30

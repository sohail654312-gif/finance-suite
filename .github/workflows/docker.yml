name: Docker

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && vars.PUBLISH_DOCKER == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          revision="$(git rev-parse HEAD)"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            tag="pr-$PR_NUMBER"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="${REF_NAME#v}"
          else
            tag="${REF_NAME//\//-}"
          fi
          {
            echo 'tags<<FINANCE_IMAGE_TAGS'
            echo "$image:$tag"
            echo "$image:sha-${revision:0:12}"
            if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "main" ]; then
              echo "$image:latest"
            fi
            echo 'FINANCE_IMAGE_TAGS'
            echo 'labels<<FINANCE_IMAGE_LABELS'
            echo "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            echo "org.opencontainers.image.revision=$revision"
            echo 'FINANCE_IMAGE_LABELS'
          } >> "$GITHUB_OUTPUT"
      - name: Build and optionally publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && (vars.PUBLISH_DOCKER == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Finance integrity regressions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: xdebug
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Prepare environment
        run: cp .env.testing .env
      - name: Install locked dependencies
        id: install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Restore tracked package sources
        run: git restore --source=HEAD --worktree -- modules themes
      - name: Generate application key
        run: php artisan key:generate
      - name: Verify accounting integrity regressions
        run: php artisan test --compact tests/Feature/FinanceIntegrityRegressionTest.php
      - name: Validate modules
        run: php artisan module:validate
      - name: Diagnose foundation
        run: php artisan foundation:doctor

  dependency-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
      - name: Resolve minimal security updates for review
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: >-
          composer update 'filament/*' laravel/framework league/commonmark phpseclib/phpseclib
          --with filament/actions:5.8.2 --with filament/filament:5.8.2
          --with filament/forms:5.8.2 --with filament/infolists:5.8.2
          --with filament/notifications:5.8.2 --with filament/query-builder:5.8.2
          --with filament/schemas:5.8.2 --with filament/spatie-laravel-settings-plugin:5.8.2
          --with filament/support:5.8.2 --with filament/tables:5.8.2 --with filament/widgets:5.8.2
          --with laravel/framework:13.30.0 --with league/commonmark:2.10.3 --with phpseclib/phpseclib:3.0.57
          --with-all-dependencies --minimal-changes --no-install --no-scripts --no-interaction --verbose
      - name: Validate resolved metadata
        run: composer validate --strict
      - name: Audit resolved dependencies
        run: composer audit --locked
      - name: Export reviewable lock proposal
        run: |
          sha256sum composer.lock
          echo FINANCE_LOCK_BEGIN
          gzip -n -c composer.lock | base64
          echo FINANCE_LOCK_END

# The resolver proposes a lock file only. It cannot push, merge, install packages,
# modify secrets, or waive audit failures. Any proposal requires diff review and
# the complete unchanged verification stack before acceptance.

# This adds focused Linux evidence. Existing Tests, Install and Docker checks,
# the dependency audit and the 100% host coverage gate remain mandatory.

name: Finance integrity regressions

on:
  pull_request:
    branches: [main, finance-suite/v1-completion, finance-suite/security-ledger-milestone]
  workflow_dispatch:


# Cancel obsolete runs for the SAME PR and workflow only. Retain all separate
# security, accounting, coverage and deployment checks on the newest SHA.
# Never cancel manual, default-branch or tagged release runs automatically.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: xdebug
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Audit locked dependencies
        run: composer audit --locked
      - name: Prepare environment
        run: cp .env.testing .env
      - name: Install locked dependencies
        id: install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Restore tracked package sources
        run: git restore --source=HEAD --worktree -- modules themes
      - name: Generate application key
        run: php artisan key:generate
      - name: Verify package architecture boundaries
        run: php artisan test --compact tests/Architecture/ModuleBoundariesTest.php
      - name: Verify accounting integrity regressions
        run: >-
          php artisan test --compact tests/Feature/FinanceIntegrityRegressionTest.php
          tests/Feature/JournalApprovalPostingIntegrityTest.php
      - name: Verify provider recovery and schema integrity
        run: >-
          php artisan test --compact tests/Feature/ProviderIntegrityRecoveryTest.php
          tests/Feature/SchemaConsistencyTest.php tests/Feature/Api/QuickBooksSyncTest.php
          tests/Feature/Api/QboAccountBillSyncTest.php tests/Feature/Api/QboPaymentSyncTest.php
          tests/Feature/Api/XeroSyncTest.php tests/Feature/Api/XeroEntitiesSyncTest.php tests/Feature/Api/SageSyncTest.php
      - name: Validate modules
        run: php artisan module:validate
      - name: Verify host reporting boundaries and coverage enforcement
        run: >-
          php artisan test --compact tests/Feature/HostAccountingReportingIntegrityTest.php
          tests/Feature/ProjectReportingCoverageTest.php
          tests/Feature/CollectionTenantSafetyTest.php
          tests/Feature/HostIdentityIntegrityTest.php
          tests/Feature/HostSubledgerIntegrityTest.php
          tests/Feature/HostBankFeedIntegrityTest.php
          tests/Feature/HostModuleIntegrityTest.php
          tests/Feature/ModularTenantOwnershipIntegrityTest.php
          tests/Feature/JournalApprovalsHttpTenantIntegrityTest.php
          tests/Feature/LegacyPostedJournalLineIntegrityTest.php
          tests/Feature/LegacyJournalBalanceIntegrityTest.php
          tests/Feature/LegacyJournalPostingHistoryTest.php
          tests/Feature/PostingReversal
          tests/Feature/FinancialLifecycleAcceptanceTest.php
          tests/Feature/Api/WiseIntegrityTest.php
          tests/Feature/AccountSetupWizardTest.php
          tests/Unit/HostCoverageGateTest.php tests/Unit/DoubleEntryAccountingTest.php
          tests/Unit/Services/GeneralLedgerServiceTest.php
          tests/Unit/Services/BudgetServiceTest.php
      - name: Diagnose foundation
        run: php artisan foundation:doctor

  postgres-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: finance_suite_test
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_DATABASE: finance_suite_test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: finance_test
      DB_PASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_pgsql, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: none
      - name: Install and audit exact lock
        run: |
          composer validate --strict
          composer audit --locked
          composer install --no-interaction --prefer-dist --optimize-autoloader
          git restore --source=HEAD --worktree -- modules themes
      - name: Prepare synthetic application
        run: |
          cp .env.testing .env
          php artisan key:generate
      - name: Prove competing PostgreSQL posting and reversal requests
        run: vendor/bin/pest --compact tests/Postgres/LegacyJournalConcurrencyTest.php

# The read-only security proposal is now reviewed and applied. Its exact cloud
# evidence and SHA-256 are recorded in REVIEW-REPAIR-BASELINE.md. Locked audit
# above and all existing Tests, Install, Docker and full verification gates remain.

name: Finance integrity regressions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: xdebug
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Prepare environment
        run: cp .env.testing .env
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Restore tracked package sources
        run: git restore --source=HEAD --worktree -- modules themes
      - name: Generate application key
        run: php artisan key:generate
      - name: Verify accounting integrity regressions
        run: php artisan test --compact tests/Feature/FinanceIntegrityRegressionTest.php
      - name: Validate modules
        run: php artisan module:validate
      - name: Diagnose foundation
        run: php artisan foundation:doctor

# This adds focused Linux evidence. Existing Tests, Install and Docker checks,
# the dependency audit and the 100% host coverage gate remain mandatory.

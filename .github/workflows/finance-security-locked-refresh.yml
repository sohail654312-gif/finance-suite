name: Finance one-shot locked security refresh

# This workflow runs once when this file is introduced on the controlled V1
# candidate branch. A bot-authored lockfile commit cannot trigger it again.
on:
  push:
    branches: [finance-suite/v1-completion]
    paths:
      - .github/workflows/finance-security-locked-refresh.yml

permissions:
  contents: write

concurrency:
  group: finance-security-locked-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/finance-suite/v1-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: none
      - name: Verify existing manifest
        run: composer validate --strict
      - name: Resolve only the five security-affected locked dependencies and their required dependencies
        run: |
          composer update \
            filament/filament livewire/livewire \
            symfony/http-foundation symfony/mime symfony/yaml \
            --with-all-dependencies --minimal-changes \
            --no-interaction --no-progress --no-scripts --no-audit
      - name: Enforce exact lockfile security audit without exceptions
        run: |
          composer validate --strict
          composer audit --locked
          git diff --check
          if git diff --quiet -- composer.lock; then
            echo "No lockfile update was produced; refusing a false security-fix commit."
            exit 1
          fi
          git diff --exit-code -- composer.json
      - name: Prepare application and restore repository-owned modules
        run: |
          cp .env.testing .env
          git restore --source=HEAD --worktree -- modules themes
          php artisan key:generate
      - name: Validate formatting across touched host code
        run: vendor/bin/pint --test
      - name: Analyse code under existing strictness
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Verify financial and tenancy regression cases
        run: >-
          php artisan test --compact
          tests/Feature/Api/JournalEntryApiTest.php
          tests/Feature/HostAccountingReportingIntegrityTest.php
          tests/Feature/LegacyJournalBalanceIntegrityTest.php
          tests/Feature/LegacyPostedJournalLineIntegrityTest.php
          tests/Feature/JournalApprovalPostingIntegrityTest.php
          tests/Feature/JournalApprovalsHttpTenantIntegrityTest.php
          tests/Feature/ModularTenantOwnershipIntegrityTest.php
      - name: Verify full application suite (coverage remains separately enforced)
        run: php artisan test --compact
      - name: Write audited Composer lockfile to candidate branch only
        env:
          EXPECTED_BRANCH: finance-suite/v1-completion
        run: |
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M composer.lock$')" || {
            echo "Unexpected tracked modifications; refusing commit."
            git status --short
            exit 1
          }
          git add -- composer.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): refresh five audited locked PHP dependencies"
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"

# This only repairs dependencies after a clean security audit, formatting,
# static analysis, targeted and full tests. Strict 100% host Clover coverage,
# integrated V1 lifecycle, and release approval remain separate red gates;
# this workflow does not modify or bypass them.

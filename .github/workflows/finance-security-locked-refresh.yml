name: Finance locked security proposal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-security-proposal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: none
      - name: Validate starting lock
        run: composer validate --strict
      - name: Record dependency graph
        run: |
          composer why --locked filament/filament
          composer why --locked livewire/livewire
      - name: Resolve patched packages and exact-version Filament companions
        run: >-
          composer update filament/filament:5.8.3
          filament/spatie-laravel-settings-plugin:5.8.3 livewire/livewire:4.4.8
          symfony/http-foundation:8.1.7 symfony/mime:8.1.10 symfony/yaml:8.1.6
          --with-all-dependencies --minimal-changes --no-install
          --no-interaction --no-progress --no-scripts
      - name: Validate audited proposal
        run: |
          composer validate --strict
          composer audit --locked --format=json > security-audit.json
          git diff --check
          git diff --exit-code -- composer.json
          sha256sum composer.lock > composer.lock.sha256
          git diff -- composer.lock > dependency-proposal.patch
      - name: Preserve Composer-generated proposal for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audited-dependency-proposal
          path: |
            composer.lock
            composer.lock.sha256
            security-audit.json
            dependency-proposal.patch
          retention-days: 14

# No repository writes, persisted credentials, deployments or advisory ignores.
# The proposal is not compatibility approval; all locked quality gates still apply.

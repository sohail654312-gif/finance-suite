name: Finance verification evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: xdebug
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Prepare environment
        run: cp .env.testing .env
      - name: Install locked dependencies
        id: install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Restore tracked package sources
        run: git restore --source=HEAD --worktree -- modules themes
      - name: Generate application key
        run: php artisan key:generate
      - name: Check formatting
        if: always() && steps.install.outcome == 'success'
        run: vendor/bin/pint --test
      - name: Static analysis
        if: always() && steps.install.outcome == 'success'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Full tests with required host coverage
        if: always() && steps.install.outcome == 'success'
        run: php artisan test --coverage --coverage-clover=coverage.xml --min=100


# Independent evidence while the mandatory Tests workflow remains blocked by
# dependency advisories. No formatter, analysis or coverage gate is waived.

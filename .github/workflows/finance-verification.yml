name: Finance verification evidence

on:
  pull_request:
    branches: [main, finance-suite/v1-completion, finance-suite/security-ledger-milestone]
  workflow_dispatch:


# Cancel obsolete runs for the SAME PR and workflow only. Retain all separate
# security, accounting, coverage and deployment checks on the newest SHA.
# Never cancel manual, default-branch or tagged release runs automatically.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: none
      - name: Install exact analysis baseline
        run: |
          composer validate --strict
          cp .env.testing .env
          composer install --no-interaction --prefer-dist --optimize-autoloader
          git restore --source=HEAD --worktree -- modules themes
          php artisan key:generate
      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=json > phpstan.json
      - name: Preserve static analysis diagnostics
        if: always() && hashFiles('phpstan.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phpstan-${{ github.run_id }}
          path: phpstan.json
          retention-days: 14
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: xdebug
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Prepare environment
        run: cp .env.testing .env
      - name: Install locked dependencies
        id: install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Restore tracked package sources
        run: git restore --source=HEAD --worktree -- modules themes
      - name: Generate application key
        run: php artisan key:generate
      - name: Check formatting
        if: always() && steps.install.outcome == 'success'
        run: vendor/bin/pint --test
      - name: Full tests with required host coverage
        id: host_tests
        if: always() && steps.install.outcome == 'success'
        run: php artisan test --coverage --min=100 --coverage-clover=coverage.xml

      - name: Verify host coverage independently
        if: always() && steps.host_tests.outcome != 'skipped'
        run: php scripts/verify-host-coverage.php coverage.xml

      - name: Preserve coverage evidence
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-coverage-${{ github.run_id }}
          path: coverage.xml
          retention-days: 14


# Independent repair evidence. No formatter, analysis or coverage gate is waived.

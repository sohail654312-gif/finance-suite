name: Posted history regressions

on:
  pull_request:
    branches: [finance-suite/security-ledger-milestone]
    paths:
      - tests/Feature/LegacyPostedJournalLineIntegrityTest.php
      - tests/Feature/Consolidation/ConsolidationServiceTest.php
      - tests/Feature/Services/FinancialStatementTenantScopingTest.php
      - .github/workflows/posted-history-regressions.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: none
      - name: Install and audit locked dependencies
        run: |
          composer validate --strict
          composer audit --locked
          cp .env.testing .env
          composer install --no-interaction --prefer-dist --optimize-autoloader
          git restore --source=HEAD --worktree -- modules themes
          php artisan key:generate
      - name: Check changed fixture formatting
        run: >-
          vendor/bin/pint --test
          tests/Feature/LegacyPostedJournalLineIntegrityTest.php
          tests/Feature/Consolidation/ConsolidationServiceTest.php
          tests/Feature/Services/FinancialStatementTenantScopingTest.php
      - name: Verify the three formerly failing suites
        run: >-
          php artisan test --compact
          tests/Feature/LegacyPostedJournalLineIntegrityTest.php
          tests/Feature/Consolidation/ConsolidationServiceTest.php
          tests/Feature/Services/FinancialStatementTenantScopingTest.php
      - name: Preserve posting authority and immutable reversal regressions
        run: php artisan test --compact tests/Feature/LegacyJournalPostingHistoryTest.php

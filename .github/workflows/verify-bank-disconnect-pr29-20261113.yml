name: Verify bank disconnect security candidate PR29
on:
  push:
    branches:
      - finance-suite/verify-bank-disconnect-pr29-20261113
permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 05e6201a8b68833e975b6891252a08025b3c83c2
          persist-credentials: false
      - name: Assert immutable PR29 source
        run: test "$(git rev-parse HEAD)" = "05e6201a8b68833e975b6891252a08025b3c83c2"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: none
      - name: Strict Composer security audit and dependency installation
        run: |
          composer validate --strict
          composer audit --locked
          cp .env.testing .env
          composer install --no-interaction --prefer-dist --optimize-autoloader
          git restore --source=HEAD --worktree -- modules themes
          php artisan key:generate
      - name: Pint on changed code and test
        run: vendor/bin/pint --test app/Filament/App/Resources/BankConnections/BankConnectionResource.php tests/Feature/BankConnectionDisconnectBoundaryTest.php
      - name: PHPStan unchanged strictness
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Real Filament bank disconnect, ownership and legacy banking regression
        run: php artisan test --compact tests/Feature/BankConnectionDisconnectBoundaryTest.php tests/Feature/BankConnectionResourceTest.php

name: Verify merged Finance Suite candidate exactly
on:
  push:
    branches:
      - finance-suite/verify-merged-pr27-20261113
permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: dd379fc41455e0742c7df1ed39fb92ae7e6f16f1
          persist-credentials: false
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "dd379fc41455e0742c7df1ed39fb92ae7e6f16f1"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: none
      - name: Strict install and locked audit
        run: |
          composer validate --strict
          composer audit --locked
          cp .env.testing .env
          composer install --no-interaction --prefer-dist --optimize-autoloader
          git restore --source=HEAD --worktree -- modules themes
          php artisan key:generate
      - name: Changed paths formatting
        run: vendor/bin/pint --test app/Console/Commands/SendPaymentReminders.php app/Models/ReminderSetting.php tests/Feature/PaymentReminderBoundaryTest.php
      - name: PHPStan unchanged strictness
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Focused reminder and notifications tests
        run: php artisan test --compact tests/Feature/PaymentReminderBoundaryTest.php tests/Feature/Notifications/NotificationSettingsTest.php

  full:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: dd379fc41455e0742c7df1ed39fb92ae7e6f16f1
          persist-credentials: false
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "dd379fc41455e0742c7df1ed39fb92ae7e6f16f1"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: xdebug
      - name: Strict install and locked audit
        run: |
          composer validate --strict
          composer audit --locked
          cp .env.testing .env
          composer install --no-interaction --prefer-dist --optimize-autoloader
          git restore --source=HEAD --worktree -- modules themes
          php artisan key:generate
      - name: Full suite plus unchanged 100 percent release gate
        id: full_tests
        run: php artisan test --coverage --min=100 --coverage-clover=coverage.xml --log-junit=junit.xml
      - name: Independent unchanged host Clover verification
        if: always() && steps.full_tests.outcome != 'skipped'
        run: php scripts/verify-host-coverage.php coverage.xml
      - name: Preserve exact candidate Clover artifacts
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merged-pr27-candidate-clover
          path: |
            coverage.xml
            junit.xml
          retention-days: 30

  postgres:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: finance_suite_test
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_DATABASE: finance_suite_test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: finance_test
      DB_PASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: dd379fc41455e0742c7df1ed39fb92ae7e6f16f1
          persist-credentials: false
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "dd379fc41455e0742c7df1ed39fb92ae7e6f16f1"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_pgsql, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: none
      - name: Strict install and locked audit
        run: |
          composer validate --strict
          composer audit --locked
          composer install --no-interaction --prefer-dist --optimize-autoloader
          git restore --source=HEAD --worktree -- modules themes
          cp .env.testing .env
          php artisan key:generate
      - name: PostgreSQL ledger concurrency
        run: vendor/bin/pest --compact tests/Postgres/LegacyJournalConcurrencyTest.php
      - name: PostgreSQL document versioning
        run: vendor/bin/pest --compact tests/Postgres/DocumentVersioningTest.php

name: Verify PR27 exact source commit
on:
  push:
    branches:
      - finance-suite/verify-pr27-3c4aadb-20261113

permissions:
  contents: read

concurrency:
  group: verify-pr27-exact-source
  cancel-in-progress: false

jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable PR #27 source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 3c4aadb724317b51cdf88e8fdd172f45d432622d
          persist-credentials: false
      - name: Assert exact source SHA
        run: test "$(git rev-parse HEAD)" = "3c4aadb724317b51cdf88e8fdd172f45d432622d"
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl, pcntl, posix, sockets
          coverage: none
      - name: Install and audit unchanged dependency lock
        run: |
          composer validate --strict
          composer audit --locked
          cp .env.testing .env
          composer install --no-interaction --prefer-dist --optimize-autoloader
          git restore --source=HEAD --worktree -- modules themes
          php artisan key:generate
      - name: Check changed files with Pint
        run: vendor/bin/pint --test app/Console/Commands/SendPaymentReminders.php tests/Feature/PaymentReminderBoundaryTest.php
      - name: Run payment-reminder regression against exact PR27 commit
        run: php artisan test --compact tests/Feature/PaymentReminderBoundaryTest.php
      - name: Run unchanged PHPStan gate
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
